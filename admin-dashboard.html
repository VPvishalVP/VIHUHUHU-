
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIHUHUHU | Admin Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b18;color:#f5f5ff;font-family:Arial,sans-serif}
header{padding:20px;background:#11152a;border-bottom:1px solid #292e49}
header h2{margin:0;color:#a78bfa}
header p{color:#aaa;font-size:13px}
.container{padding:18px;max-width:1000px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#141a30;border:1px solid #292f4c;padding:17px;border-radius:14px}
.card small{color:#aaa}
.card h2{margin:10px 0 0;color:#55e6df}
h3{margin-top:25px;color:#a78bfa}
input,select,textarea{
width:100%;padding:13px;margin:7px 0 12px;
background:#0c1124;border:1px solid #343b5d;
border-radius:9px;color:white;font-size:14px
}
textarea{min-height:85px}
button{
border:0;padding:12px 16px;border-radius:9px;
background:#8b5cf6;color:white;font-weight:bold;
cursor:pointer;margin:4px
}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.menu button{background:#202744}
.item{background:#141a30;border:1px solid #303653;padding:14px;border-radius:12px;margin:10px 0}
.item p{color:#aaa;font-size:13px;overflow-wrap:anywhere}
.delete{background:#dc3545}
#status{color:#55e6df;font-size:13px}
</style>
</head>
<body>

<header>
<h2>VIHUHUHU ADMIN</h2>
<p>Study Zone Management Panel</p>
</header>

<div class="container">

<div class="stats">
<div class="card"><small>Total Content</small><h2 id="total">0</h2></div>
<div class="card"><small>Study Sections</small><h2>8</h2></div>
</div>

<h3>Manage Study Zone</h3>
<div class="menu">
<button onclick="setType('Classes')">Classes</button>
<button onclick="setType('Subjects')">Subjects</button>
<button onclick="setType('Notes & PDF')">Notes & PDF</button>
<button onclick="setType('Quiz')">Quiz</button>
<button onclick="setType('Test Series')">Test Series</button>
<button onclick="setType('YouTube Classes')">YouTube Classes</button>
<button onclick="setType('Courses')">Courses</button>
<button onclick="setType('Current Affairs')">Current Affairs</button>
</div>

<h3>Add New Content</h3>

<form id="contentForm">
<label>Content Type</label>
<select id="type">
<option>Classes</option>
<option>Subjects</option>
<option>Notes & PDF</option>
<option>Quiz</option>
<option>Test Series</option>
<option>YouTube Classes</option>
<option>Courses</option>
<option>Current Affairs</option>
</select>

<label>Title</label>
<input id="title" placeholder="Content title" required>

<label>Description</label>
<textarea id="description" placeholder="Description"></textarea>

<label>Class</label>
<select id="className">
<option value="">Select Class</option>
<option>Class 6</option>
<option>Class 7</option>
<option>Class 8</option>
<option>Class 9</option>
<option>Class 10</option>
<option>Class 11</option>
<option>Class 12</option>
</select>

<label>Subject</label>
<input id="subject" placeholder="e.g. Mathematics">

<label>PDF / Video / Content URL</label>
<input id="url" type="url" placeholder="https://...">

<button type="submit">Save Content</button>
</form>

<p id="status"></p>

<h3>Saved Content</h3>
<div id="contentList"></div>

</div>

<script>
const KEY="vihuStudyAdmin";
let content=JSON.parse(localStorage.getItem(KEY)||"[]");

function render(){
document.getElementById("total").textContent=content.length;
document.getElementById("contentList").innerHTML=
content.map((item,i)=>`
<div class="item">
<strong>${escapeHTML(item.title)}</strong>
<p>${escapeHTML(item.type)} | ${escapeHTML(item.className||"All Classes")} | ${escapeHTML(item.subject||"No Subject")}</p>
<p>${escapeHTML(item.description||"")}</p>
${item.url?`<p>${escapeHTML(item.url)}</p>`:""}
<button class="delete" onclick="removeItem(${i})">Delete</button>
</div>`).join("")||"<p>No content added yet.</p>";
}

function escapeHTML(value){
return String(value).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function setType(value){
document.getElementById("type").value=value;
document.getElementById("title").focus();
}

document.getElementById("contentForm").addEventListener("submit",function(e){
e.preventDefault();
content.push({
type:document.getElementById("type").value,
title:document.getElementById("title").value.trim(),
description:document.getElementById("description").value.trim(),
className:document.getElementById("className").value,
subject:document.getElementById("subject").value.trim(),
url:document.getElementById("url").value.trim()
});
localStorage.setItem(KEY,JSON.stringify(content));
this.reset();
document.getElementById("status").textContent="Content saved on this browser.";
render();
});

function removeItem(i){
if(!confirm("Delete this content?"))return;
content.splice(i,1);
localStorage.setItem(KEY,JSON.stringify(content));
render();
}
render();
</script>
</body>
</html>

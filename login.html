
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIHUHUHU Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{
min-height:100vh;display:flex;align-items:center;
justify-content:center;background:#050510;color:white;
padding:20px;overflow-x:hidden
}
body:before{
content:"";position:fixed;width:500px;height:500px;
background:conic-gradient(red,orange,yellow,lime,cyan,blue,violet,red);
filter:blur(100px);opacity:.35;animation:spin 8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
.card{
position:relative;width:100%;max-width:390px;padding:30px;
border-radius:24px;background:#ffffff12;
backdrop-filter:blur(20px);
border:1px solid #ffffff40;
box-shadow:0 20px 60px #0008
}
h1{text-align:center;font-size:30px;text-shadow:0 0 15px cyan}
.sub{text-align:center;color:#bbb;margin:10px 0 25px}
label{display:block;font-size:13px;margin:14px 0 7px}
input{
width:100%;padding:13px;border-radius:10px;
background:#0007;border:1px solid #666;
color:white;outline:none;font-size:15px
}
input:focus{border-color:cyan;box-shadow:0 0 12px #00ffff55}
button{
width:100%;padding:14px;margin-top:22px;
border:0;border-radius:10px;font-weight:bold;
font-size:16px;cursor:pointer;
background:linear-gradient(90deg,cyan,#a855f7,#ff3cac,yellow);
color:#080817
}
button:disabled{opacity:.6}
.links{text-align:center;margin-top:20px;color:#ccc;font-size:14px}
a{color:#55e6ff;text-decoration:none}
#message{text-align:center;margin-top:15px;font-size:14px;overflow-wrap:anywhere}
</style>
</head>

<body>
<div class="card">

<h1>VIHUHUHU</h1>
<p class="sub">Welcome Back!</p>

<form id="loginForm">

<label>Email / Username / Mobile Number</label>
<input
id="identifier"
type="text"
required
autocomplete="username"
placeholder="Enter email, username or 10 digit mobile"
>

<label>Password</label>
<input
id="password"
type="password"
required
autocomplete="current-password"
placeholder="Enter your password"
>

<button id="loginBtn" type="submit">
LOGIN NOW →
</button>

</form>

<p id="message" role="status"></p>

<div class="links">
Don't have an account?
<a href="register.html">Register Now</a>
<br><br>
<a href="index.html">← Back to Home</a>
</div>

</div>

<script type="module">
import { createClient } from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SUPABASE_URL =
'https://piagvuicgazqgjkgrvjr.supabase.co';

const SUPABASE_KEY =
'sb_publishable_CTnGMVV3LaZBrglKLxdkoA_KCTs7eHZ';

const FUNCTION_URL =
'https://piagvuicgazqgjkgrvjr.supabase.co/functions/v1/hyper-processor';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const form = document.getElementById('loginForm');
const message = document.getElementById('message');
const btn = document.getElementById('loginBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const identifier = document.getElementById('identifier').value.trim();
  const password = document.getElementById('password').value;

  btn.disabled = true;
  message.textContent = 'Logging in...';

  try {
    const response = await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify({ identifier, password })
    });

    const result = await response.json();

    if (!response.ok || result.error) {
      throw new Error(result.error || 'Login failed');
    }

    const { error } = await supabase.auth.setSession({
      access_token: result.access_token,
      refresh_token: result.refresh_token
    });

    if (error) throw error;

    // Record login activity
    const { data: userData, error: userError } =
      await supabase.auth.getUser();

    if (!userError && userData.user) {
      const { error: activityError } = await supabase
        .from('user_activity')
        .insert({
          user_id: userData.user.id,
          activity_type: 'login'
        });

      if (activityError) {
        console.warn('Activity recording failed:', activityError.message);
      }
    }

    message.textContent = 'Login successful!';

    window.location.href = 'index.html';

  } catch (error) {
    message.textContent = error.message;
  } finally {
    btn.disabled = false;
  }
});
</script>

</body>
</html>

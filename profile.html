
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | VIHUHUHU</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family: "Segoe UI", Arial, sans-serif;
  color: #f8f7ff;
  background:
    radial-gradient(ellipse at 15% 10%, #5925a0 0%, transparent 38%),
    radial-gradient(ellipse at 90% 85%, #153d83 0%, transparent 40%),
    linear-gradient(135deg, #080b19, #17102c 55%, #080d20);
}

.container { max-width: 500px; margin: 35px auto; }

h1 {
  text-align: center;
  font-size: 29px;
  letter-spacing: 2px;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.subtitle {
  text-align: center;
  color: #b9b3d0;
  font-size: 13px;
  margin-top: -12px;
  margin-bottom: 25px;
}

.card {
  padding: 28px;
  border-radius: 22px;
  background: rgba(255,255,255,.075);
  border: 1px solid rgba(255,255,255,.15);
  box-shadow: 0 20px 60px #0007;
  backdrop-filter: blur(18px);
}

.avatar {
  width: 92px;
  height: 92px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin: 0 auto 18px;
  font-size: 38px;
  background: linear-gradient(135deg,#a855f7,#4f46e5);
  border: 3px solid #ffffff70;
  box-shadow: 0 0 28px #914cff70;
}

.name {
  text-align: center;
  font-size: 25px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.email {
  text-align: center;
  color: #c4b5fd;
  font-size: 14px;
  margin-top: 7px;
  overflow-wrap: anywhere;
}

.info {
  padding: 15px;
  margin-top: 13px;
  border-radius: 12px;
  background: rgba(255,255,255,.06);
  border: 1px solid #ffffff15;
  color: #e8e5f5;
  font-size: 14px;
  overflow-wrap: anywhere;
}

h3 { margin-top: 28px; font-size: 19px; }

label {
  display: block;
  margin: 16px 0 8px;
  color: #d8ccff;
  font-size: 13px;
  font-weight: 600;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 11px;
  border: 1px solid #ffffff25;
  outline: none;
  background: #100d20;
  color: white;
  font-size: 15px;
}

input:focus {
  border-color: #a78bfa;
  box-shadow: 0 0 0 3px #8b5cf633;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 12px;
  margin-top: 17px;
  color: white;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 1px;
  background: linear-gradient(100deg,#9333ea,#4f46e5);
  cursor: pointer;
}

button:disabled { opacity: .6; }

.logout {
  background: #29243b;
  border: 1px solid #ffffff25;
}

#message {
  text-align: center;
  color: #a7f3d0;
  font-size: 14px;
  margin-top: 18px;
  overflow-wrap: anywhere;
}

.back {
  display: block;
  text-align: center;
  color: #c4b5fd;
  text-decoration: none;
  margin-top: 20px;
  font-size: 14px;
}
</style>
</head>

<body>
<div class="container">

  <h1 id="topUserName">Loading...</h1>
  <p class="subtitle">YOUR PERSONAL ACCOUNT</p>

  <div class="card">

    <div class="avatar">👤</div>

    <div class="name" id="displayName">Loading...</div>
    <div class="email" id="displayEmail"></div>

    <div class="info" id="userId">User ID: Loading...</div>
    <div class="info" id="joined">Joined: Loading...</div>

    <h3>✦ Edit Profile</h3>

    <label>Full Name</label>
    <input type="text" id="fullName" placeholder="Enter your full name">

    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username">

    <label>Phone Number</label>
    <input type="tel" id="phone" maxlength="10"
      inputmode="numeric" placeholder="10 digit mobile number">

    <button id="saveButton" onclick="saveProfile()">SAVE PROFILE</button>
    <button class="logout" onclick="logout()">LOGOUT</button>

    <div id="message"></div>
  </div>

  <a class="back" href="index.html">← Back to Home</a>

</div>

<script>
const client = supabase.createClient(
  "https://piagvuicgazqgjkgrvjr.supabase.co",
  "sb_publishable_CTnGMVV3LaZBrglKLxdkoA_KCTs7eHZ"
);

let currentUser = null;

async function loadProfile() {
  const { data: authData, error: authError } =
    await client.auth.getUser();

  if (authError || !authData.user) {
    window.location.href = "login.html";
    return;
  }

  currentUser = authData.user;

  document.getElementById("displayEmail").textContent =
    currentUser.email || "";

  document.getElementById("userId").textContent =
    "User ID: " + currentUser.id;

  const joinedDate = new Date(currentUser.created_at);

  document.getElementById("joined").textContent =
    "Joined: " + joinedDate.toLocaleDateString("en-IN");

  const { data, error } = await client
    .from("profiles")
    .select("username, full_name, phone, created_at")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error) {
    showMessage("Profile load error: " + error.message);
    return;
  }

  const profileName =
    data?.full_name ||
    currentUser.user_metadata?.full_name ||
    currentUser.user_metadata?.name ||
    data?.username ||
    currentUser.email?.split("@")[0] ||
    "User";

  document.getElementById("topUserName").textContent =
    profileName;

  document.getElementById("displayName").textContent =
    profileName;

  if (data) {
    document.getElementById("fullName").value =
      data.full_name || "";

    document.getElementById("username").value =
      data.username || "";

    document.getElementById("phone").value =
      data.phone || "";
  }
}

async function saveProfile() {
  if (!currentUser) return;

  const fullName =
    document.getElementById("fullName").value.trim();

  const username =
    document.getElementById("username").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  if (!fullName || !username) {
    showMessage("Please enter name and username.");
    return;
  }

  if (phone && !/^[0-9]{10}$/.test(phone)) {
    showMessage("Phone number must be 10 digits.");
    return;
  }

  const button = document.getElementById("saveButton");
  button.disabled = true;
  button.textContent = "SAVING...";

  const { data, error } = await client
    .from("profiles")
    .update({
      full_name: fullName,
      username: username,
      phone: phone || null
    })
    .eq("id", currentUser.id)
    .select();

  button.disabled = false;
  button.textContent = "SAVE PROFILE";

  if (error) {
    showMessage("Error: " + error.message);
    return;
  }

  if (!data || data.length === 0) {
    showMessage("Profile not found or update not allowed.");
    return;
  }

  document.getElementById("topUserName").textContent =
    fullName;

  document.getElementById("displayName").textContent =
    fullName;

  showMessage("Profile updated successfully!");
}

async function logout() {
  await client.auth.signOut();
  window.location.href = "login.html";
}

function showMessage(message) {
  document.getElementById("message").textContent = message;
}

loadProfile();
</script>

</body>
</html>

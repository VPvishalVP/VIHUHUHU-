
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090817">
<title>VIHUHUHU Wallet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#090817;color:white;font-family:Arial}
.container{max-width:550px;margin:auto}
header{text-align:center;padding:20px}
.logo{font-size:27px;font-weight:bold;color:#a78bfa}
.card{background:#17142b;border:1px solid #393052;border-radius:20px;padding:20px;margin-bottom:18px}
.balance{background:linear-gradient(135deg,#6d28d9,#0891b2);border:0}
.balance h1{font-size:36px}
.small{font-size:13px;color:#c4bddb}
input{width:100%;padding:14px;margin:9px 0;border-radius:11px;background:#0d0b1b;border:1px solid #51456d;color:white;font-size:16px}
button{width:100%;padding:14px;border:0;border-radius:12px;background:#a78bfa;color:#100b20;font-weight:bold;font-size:15px}
button:disabled{opacity:.5}
.secondary{background:#29233d;color:white;margin-top:10px}
#message{color:#67e8f9;font-size:14px;overflow-wrap:anywhere}
.history-item{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #393052;font-size:13px}
</style>
</head>

<body>
<div class="container">

<header>
<div class="logo">VIHUHUHU</div>
<p class="small">SECURE DIGITAL WALLET</p>
</header>

<div class="card balance">
<p>AVAILABLE BALANCE</p>
<h1 id="balance">₹0.00</h1>
<div id="accountStatus">Checking login...</div>
</div>

<div class="card">
<h3>Add Money</h3>

<p class="small">UPI ID</p>
<div id="upiId">YOUR_UPI_ID_HERE</div>

<button class="secondary" onclick="copyUPI()">Copy UPI ID</button>

<input id="depositAmount" type="number" min="1" max="100000" placeholder="Amount in ₹">
<input id="utr" type="text" maxlength="64" placeholder="Enter UTR Number">

<button id="submitBtn" onclick="submitDeposit()">Submit Deposit Request</button>

<p id="message"></p>
<p class="small">Request भेजने के बाद भुगतान की स्वतंत्र पुष्टि आवश्यक है।</p>
</div>

<div class="card">
<h3>Transaction History</h3>
<div id="history">Loading...</div>
</div>

</div>

<script>
const SUPABASE_URL =
"https://piagvuicgazqgjkgrvjr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_CTnGMVV3LaZBrglKLxdkoA_KCTs7eHZ";

const supabaseClient = window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY,
 {
  auth:{
   persistSession:true,
   autoRefreshToken:true,
   detectSessionInUrl:true
  }
 }
);

let currentUser = null;
let requestRunning = false;

function showMessage(text){
 document.getElementById("message").textContent = text;
}

function formatMoney(paise){
 return "₹" + (Number(paise || 0)/100).toFixed(2);
}

async function copyUPI(){
 const upi = document.getElementById("upiId").textContent;
 try{
  await navigator.clipboard.writeText(upi);
  showMessage("UPI ID copied!");
 }catch(e){
  showMessage("UPI ID manually copy करें।");
 }
}

async function loadWallet(){
 if(!currentUser) return;

 document.getElementById("accountStatus").textContent =
 "Loading wallet...";

 const {data:wallet,error:walletError} =
 await supabaseClient.rpc("get_my_wallet");

 if(walletError){
  console.error("Wallet error:",walletError);
  document.getElementById("accountStatus").textContent =
   "Wallet load failed";
 }else{
  const balance = wallet?.[0]?.balance_paise ?? 0;
  document.getElementById("balance").textContent =
   formatMoney(balance);
  document.getElementById("accountStatus").textContent =
   "Account connected";
 }

 const {data:transactions,error:historyError} =
 await supabaseClient
 .from("wallet_transactions")
 .select("id,amount_paise,transaction_type,status,created_at")
 .eq("user_id",currentUser.id)
 .order("created_at",{ascending:false})
 .limit(20);

 const history = document.getElementById("history");

 if(historyError){
  console.error(historyError);
  history.textContent = "History load नहीं हुई।";
  return;
 }

 if(!transactions || !transactions.length){
  history.textContent = "अभी कोई transaction नहीं है।";
  return;
 }

 history.innerHTML = "";

 transactions.forEach(item=>{
  const div = document.createElement("div");
  div.className = "history-item";

  const left = document.createElement("span");
  left.textContent =
   item.transaction_type + " • " +
   new Date(item.created_at).toLocaleDateString("en-IN") +
   " • " + item.status;

  const right = document.createElement("span");
  right.textContent = formatMoney(item.amount_paise);

  div.append(left,right);
  history.appendChild(div);
 });
}

async function submitDeposit(){
 if(requestRunning) return;

 if(!currentUser){
  showMessage("पहले Login करें।");
  return;
 }

 const amount = Number(
  document.getElementById("depositAmount").value
 );
 const utr = document.getElementById("utr").value.trim();

 if(!Number.isInteger(amount) || amount<1 || amount>100000){
  showMessage("₹1 से ₹1,00,000 तक सही Amount भरें।");
  return;
 }

 if(!/^[a-zA-Z0-9]{8,64}$/.test(utr)){
  showMessage("सही UTR नंबर भरें।");
  return;
 }

 requestRunning = true;
 const btn = document.getElementById("submitBtn");
 btn.disabled = true;
 btn.textContent = "Submitting...";

 try{
  const {data:sessionData,error:sessionError} =
   await supabaseClient.auth.getSession();

  if(sessionError) throw sessionError;

  const session = sessionData.session;

  if(!session?.access_token){
   throw new Error("Login session नहीं मिली। दोबारा Login करें।");
  }

  const response = await fetch(
   SUPABASE_URL + "/functions/v1/wallet-deposit",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json",
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer " + session.access_token
    },
    body:JSON.stringify({amount,utr})
   }
  );

  const result = await response.json().catch(()=>({}));

  if(!response.ok){
   throw new Error(
    result.error || result.message ||
    "Server error: " + response.status
   );
  }

  if(result.error) throw new Error(result.error);

  showMessage(
   result.message || "Request भेज दी गई। Verification बाकी है।"
  );

  document.getElementById("depositAmount").value = "";
  document.getElementById("utr").value = "";

 }catch(error){
  console.error("Deposit error:",error);
  showMessage("Error: " + error.message);
 }finally{
  requestRunning = false;
  btn.disabled = false;
  btn.textContent = "Submit Deposit Request";
 }
}

async function init(){
 const {data,error} =
 await supabaseClient.auth.getSession();

 if(error || !data.session){
  currentUser = null;
  document.getElementById("accountStatus").textContent =
   "Please login first";
  document.getElementById("history").textContent =
   "Login करने के बाद History दिखेगी।";
  showMessage("पहले Login करें।");
  return;
 }

 currentUser = data.session.user;
 await loadWallet();
}

init();

supabaseClient.auth.onAuthStateChange(
 (_event,session)=>{
  currentUser = session?.user || null;

  if(currentUser){
   loadWallet();
  }else{
   document.getElementById("balance").textContent = "₹0.00";
   document.getElementById("accountStatus").textContent =
    "Please login first";
   document.getElementById("history").textContent =
    "Login करने के बाद History दिखेगी।";
  }
 }
);
</script>
</body>
</html>

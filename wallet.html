
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIHUHUHU Wallet</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100b20;color:white;font-family:Arial;padding:18px}
.container{max-width:500px;margin:auto}
h1{text-align:center;color:#d8a5ff}
.card{background:#211535;border:1px solid #68418b;border-radius:18px;padding:20px;margin:18px 0}
.balance{font-size:35px;color:#61f5d0;font-weight:bold}
input{width:100%;padding:14px;margin:9px 0;border:0;border-radius:9px}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#a855f7;color:white;font-weight:bold}
.qr{width:220px;max-width:100%;background:white;padding:10px;border-radius:12px}
.item{padding:12px 0;border-bottom:1px solid #49345f}
small{color:#bbb}
.pending{color:#ffd166}
.approved{color:#61f5d0}
.rejected{color:#ff7777}
</style>
</head>
<body>
<div class="container">
<h1>💜 VIHUHUHU WALLET</h1>

<div class="card">
<small>MY WALLET BALANCE</small>
<div class="balance" id="balance">₹0.00</div>
</div>

<div class="card">
<h3>📷 Scan & Pay</h3>
<center>
<img class="qr" src="YOUR_QR_IMAGE_URL" alt="UPI QR Code">
<p>Scan QR and make payment</p>
</center>

<label>Deposit Amount (₹)</label>
<input id="amount" type="number" min="1" max="100000" placeholder="Enter amount">

<label>UTR / Transaction Reference</label>
<input id="utr" type="text" maxlength="64" placeholder="Enter UTR number">

<button onclick="submitDeposit()">Submit Deposit Request</button>
<p id="message"></p>
</div>

<div class="card">
<h3>📜 Deposit History</h3>
<div id="history">Loading...</div>
</div>
</div>

<script>
const client=window.supabase.createClient(
"https://piagvuicgazqgjkgrvjr.supabase.co",
"sb_publishable_CTnGMVV3LaZBrglKLxdkoA_KCTs7eHZ"
);

let currentUser=null;

async function loadWallet(){
 const {data:{session}}=await client.auth.getSession();
 if(!session){
  document.getElementById("history").textContent="Please login first.";
  return;
 }
 currentUser=session.user;

 const {data:wallet,error}=await client
 .from("wallets")
 .select("balance_paise")
 .eq("user_id",currentUser.id)
 .maybeSingle();

 if(error){
  document.getElementById("history").textContent=error.message;
  return;
 }

 document.getElementById("balance").textContent=
 "₹"+((wallet?.balance_paise||0)/100).toFixed(2);

 const {data:rows,error:txError}=await client
 .from("wallet_transactions")
 .select("amount_paise,transaction_type,status,payment_reference,created_at")
 .eq("user_id",currentUser.id)
 .order("created_at",{ascending:false});

 if(txError){
  document.getElementById("history").textContent=txError.message;
  return;
 }

 const box=document.getElementById("history");
 box.innerHTML="";

 (rows||[]).forEach(tx=>{
  const div=document.createElement("div");
  div.className="item";

  const title=document.createElement("b");
  title.textContent=tx.transaction_type.toUpperCase()+" - ₹"+(tx.amount_paise/100).toFixed(2);

  const status=document.createElement("p");
  status.className=tx.status;
  status.textContent="Status: "+tx.status.toUpperCase();

  const ref=document.createElement("small");
  ref.textContent="UTR: "+(tx.payment_reference||"Not provided");

  div.append(title,status,ref);
  box.append(div);
 });

 if(!rows?.length)box.textContent="No deposits yet.";
}

async function submitDeposit(){
 const message=document.getElementById("message");
 const amount=Number(document.getElementById("amount").value);
 const utr=document.getElementById("utr").value.trim();

 message.textContent="";

 if(!currentUser){
  message.textContent="Please login first.";
  return;
 }

 if(!Number.isSafeInteger(amount)||amount<1||amount>100000){
  message.textContent="Enter a valid amount.";
  return;
 }

 if(!/^[A-Za-z0-9]{8,64}$/.test(utr)){
  message.textContent="Enter a valid UTR.";
  return;
 }

 message.textContent="Submitting...";

 const {data:{session}}=await client.auth.getSession();

 const {data,error}=await client.functions.invoke("wallet-deposit",{
  body:{amount,utr}
 });

 if(error){
  message.textContent="Error: "+error.message;
  return;
 }

 if(!data?.success){
  message.textContent=data?.error||"Request failed";
  return;
 }

 message.textContent="Deposit request submitted. Status: PENDING";
 await loadWallet();
}
 const message=document.getElementById("message");
 const amount=Number(document.getElementById("amount").value);
 const utr=document.getElementById("utr").value.trim();

 message.textContent="";

 if(!currentUser){
  message.textContent="Please login first.";
  return;
 }

 if(!Number.isSafeInteger(amount)||amount<1||amount>100000){
  message.textContent="Enter a valid amount.";
  return;
 }

 if(!/^[A-Za-z0-9]{8,64}$/.test(utr)){
  message.textContent="Enter a valid UTR reference.";
  return;
 }

 message.textContent="This demo form is not connected to secure deposit verification. No money or wallet balance has been changed.";
}

loadWallet();
</script>
</body>
</html>

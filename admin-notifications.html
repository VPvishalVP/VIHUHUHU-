
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Notifications | VIHUHUHU</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100vh;
  font-family: "Segoe UI", Arial, sans-serif;
  color: #fff;
  background:
    radial-gradient(ellipse at 10% 10%, #57249a 0%, transparent 38%),
    radial-gradient(ellipse at 90% 90%, #153d83 0%, transparent 40%),
    #080b19;
}

.container {
  max-width: 750px;
  margin: 30px auto;
}

.header {
  text-align: center;
  margin-bottom: 25px;
}

.header h1 {
  letter-spacing: 3px;
  font-size: 28px;
}

.header p {
  color: #c4b5fd;
  font-size: 14px;
}

.card {
  background: rgba(255,255,255,.075);
  border: 1px solid #ffffff20;
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 22px;
  box-shadow: 0 15px 40px #0005;
}

h2 {
  font-size: 20px;
  margin-top: 0;
}

label {
  display: block;
  margin: 16px 0 8px;
  color: #d8ccff;
  font-size: 14px;
}

input, textarea {
  width: 100%;
  padding: 13px;
  color: white;
  background: #100d20;
  border: 1px solid #ffffff25;
  border-radius: 10px;
  outline: none;
  font-size: 15px;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

input:focus, textarea:focus {
  border-color: #a78bfa;
}

button {
  padding: 13px 18px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(100deg,#9333ea,#4f46e5);
  color: white;
  font-weight: 700;
  cursor: pointer;
  margin-top: 15px;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.secondary {
  background: #302744;
  border: 1px solid #ffffff25;
}

.notice {
  padding: 17px;
  border-radius: 12px;
  background: #ffffff0b;
  border: 1px solid #ffffff18;
  margin-top: 14px;
  overflow-wrap: anywhere;
}

.notice h3 {
  margin: 0 0 8px;
  color: #d8b4fe;
}

.notice p {
  color: #e5e1ef;
  line-height: 1.6;
  white-space: pre-wrap;
}

.notice small {
  color: #aaa2bd;
}

.notice button {
  background: #7430a8;
  padding: 9px 13px;
  font-size: 12px;
}

#message {
  margin-top: 15px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.back {
  display: block;
  text-align: center;
  color: #c4b5fd;
  text-decoration: none;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>👑 VIHUHUHU</h1>
    <p>ADMIN NOTIFICATION CENTER</p>
  </div>

  <div class="card">
    <h2>🔔 Send New Notification</h2>

    <label>Notification Title</label>
    <input
      type="text"
      id="noticeTitle"
      maxlength="100"
      placeholder="Enter notification title"
    >

    <label>Notification Message</label>
    <textarea
      id="noticeMessage"
      maxlength="2000"
      placeholder="Write your notification..."
    ></textarea>

    <button id="sendButton" onclick="sendNotification()">
      SEND NOTIFICATION
    </button>

    <div id="message"></div>
  </div>

  <div class="card">
    <h2>📢 Active Notifications</h2>
    <div id="noticeList">Loading notifications...</div>
    <button class="secondary" onclick="loadNotifications()">
      REFRESH LIST
    </button>
  </div>

  <a class="back" href="admin-dashboard.html">
    ← Back to Admin Dashboard
  </a>

</div>

<script>
const client = supabase.createClient(
  "https://piagvuicgazqgjkgrvjr.supabase.co",
  "sb_publishable_CTnGMVV3LaZBrglKLxdkoA_KCTs7eHZ"
);

let currentUser = null;

function showMessage(text, success = false) {
  const el = document.getElementById("message");
  el.textContent = text;
  el.style.color = success ? "#86efac" : "#fca5a5";
}

async function checkAdmin() {
  const { data: authData, error: authError } =
    await client.auth.getUser();

  if (authError || !authData.user) {
    window.location.href = "login.html";
    return false;
  }

  currentUser = authData.user;

  const { data: profile, error } = await client
    .from("profiles")
    .select("role")
    .eq("id", currentUser.id)
    .maybeSingle();

  if (error || !profile || profile.role !== "admin") {
    document.body.innerHTML =
      "<h2 style='text-align:center;color:white;margin-top:100px'>Access Denied</h2>";
    return false;
  }

  return true;
}

async function sendNotification() {
  const title =
    document.getElementById("noticeTitle").value.trim();

  const message =
    document.getElementById("noticeMessage").value.trim();

  if (!title || !message) {
    showMessage("Please enter title and message.");
    return;
  }

  const button = document.getElementById("sendButton");
  button.disabled = true;
  button.textContent = "SENDING...";

  const { error } = await client
    .from("notifications")
    .insert({
      title: title,
      message: message,
      created_by: currentUser.id,
      is_active: true
    });

  button.disabled = false;
  button.textContent = "SEND NOTIFICATION";

  if (error) {
    showMessage("Error: " + error.message);
    return;
  }

  document.getElementById("noticeTitle").value = "";
  document.getElementById("noticeMessage").value = "";

  showMessage("Notification sent successfully!", true);
  await loadNotifications();
}

async function loadNotifications() {
  const list = document.getElementById("noticeList");
  list.textContent = "Loading...";

  const { data, error } = await client
    .from("notifications")
    .select("id, title, message, created_at")
    .eq("is_active", true)
    .order("created_at", { ascending: false });

  if (error) {
    list.textContent = "Error: " + error.message;
    return;
  }

  if (!data || data.length === 0) {
    list.textContent = "No active notifications.";
    return;
  }

  list.replaceChildren();

  data.forEach(item => {
    const card = document.createElement("div");
    card.className = "notice";

    const heading = document.createElement("h3");
    heading.textContent = "🔔 " + item.title;

    const paragraph = document.createElement("p");
    paragraph.textContent = item.message;

    const date = document.createElement("small");
    date.textContent =
      new Date(item.created_at).toLocaleString("en-IN");

    const button = document.createElement("button");
    button.textContent = "Deactivate";
    button.onclick = () => deactivateNotification(item.id);

    card.append(heading, paragraph, date, document.createElement("br"), button);
    list.appendChild(card);
  });
}

async function deactivateNotification(id) {
  if (!confirm("Deactivate this notification?")) return;

  const { error } = await client
    .from("notifications")
    .update({ is_active: false })
    .eq("id", id);

  if (error) {
    showMessage("Error: " + error.message);
    return;
  }

  showMessage("Notification deactivated.", true);
  await loadNotifications();
}

async function start() {
  const allowed = await checkAdmin();

  if (allowed) {
    await loadNotifications();
  }
}

start();
</script>

</body>
</html>
